# Daily liveness + ingest-freshness check. A failed run makes GitHub email the repo owner,
# which is our free alerting. /healthz is public but returns no listing data.
name: Healthcheck

on:
  schedule:
    - cron: "13 3 * * *" # 03:13 UTC = 08:43 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: healthcheck
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Resolve URL
        id: config
        env:
          RESOLVE_D1: "0"
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/prepare-wrangler-config.mjs wrangler.jsonc
      - name: Check /healthz
        env:
          BASE: ${{ steps.config.outputs.base_url }}
          MAX_INGEST_AGE_MIN: "720" # 12 h = three missed 4-hourly runs
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 10 --max-time 15 "$BASE/healthz")
          echo "healthz: $body"
          node -e '
            let j; try { j = JSON.parse(process.argv[1]); } catch { process.exit(0); } // plain "ok" is fine
            const age = j.lastIngestAgeMin, max = Number(process.env.MAX_INGEST_AGE_MIN);
            if (typeof age === "number" && age > max) {
              console.log(`::error::Last successful ingest was ${age} min ago (> ${max}). Check Apify credit and Worker logs.`);
              process.exit(1);
            }
          ' "$body"
