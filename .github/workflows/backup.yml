# Weekly encrypted export of the D1 database, kept 30 days as a workflow artifact.
# (D1 Time Travel already gives 7-day point-in-time restore on the free plan; this is the
# off-platform copy.) The dump contains third-party phone numbers, so it is AES-256
# encrypted with BACKUP_PASSPHRASE before upload. Decrypt with:
#   openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in flat-hunt-*.sql.gz.enc -pass pass:'<passphrase>' | gunzip > restore.sql
name: Backup

on:
  schedule:
    - cron: "47 21 * * 0" # Sundays 21:47 UTC = Monday 03:17 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4.156.2"
  WRANGLER_SEND_METRICS: "false"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Cloudflare secrets missing"; exit 1; }
          [ ${#BACKUP_PASSPHRASE} -ge 20 ] || { echo "::error::Set BACKUP_PASSPHRASE (20+ chars) in repo secrets"; exit 1; }

      - name: Resolve D1 id
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: node .github/scripts/prepare-wrangler-config.mjs wrangler.jsonc

      - name: Export, compress, encrypt
        id: dump
        run: |
          umask 077
          stamp=$(date -u +%Y%m%dT%H%MZ)
          work="$RUNNER_TEMP/backup"; mkdir -p "$work" out
          npx --yes "wrangler@${WRANGLER_VERSION}" d1 export flat-hunt --remote --output "$work/dump.sql" --skip-confirmation
          bytes=$(wc -c < "$work/dump.sql"); echo "dump size: $bytes bytes"
          [ "$bytes" -gt 100 ] || { echo "::error::Export looks empty"; exit 1; }
          gzip -9 "$work/dump.sql"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$work/dump.sql.gz" -out "out/flat-hunt-$stamp.sql.gz.enc" -pass env:BACKUP_PASSPHRASE
          rm -rf "$work"
          echo "name=flat-hunt-$stamp" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dump.outputs.name }}
          path: out/*.enc
          retention-days: 30
          if-no-files-found: error
