# Every push to main: run CI, apply D1 migrations, deploy the Worker, push secrets, smoke-test.
# If the smoke test fails, roll back to the previous Worker version automatically.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button: redeploy, e.g. after rotating a secret

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never kill a deploy halfway through a migration

env:
  NODE_VERSION: "22"
  WRANGLER_VERSION: "4.156.2"
  WRANGLER_SEND_METRICS: "false"

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Cloudflare Workers
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.config.outputs.base_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check required secrets
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APIFY_TOKEN INGEST_SECRET APP_PASSWORD SESSION_SECRET; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          [ -z "$missing" ] || { echo "::error::Missing GitHub Actions secrets:$missing (Settings > Secrets and variables > Actions)"; exit 1; }
          [ ${#APP_PASSWORD} -ge 16 ] || { echo "::error::APP_PASSWORD must be at least 16 characters"; exit 1; }
          [ ${#SESSION_SECRET} -ge 32 ] || { echo "::error::SESSION_SECRET must be at least 32 characters"; exit 1; }
          [ ${#INGEST_SECRET} -ge 32 ] || { echo "::error::INGEST_SECRET must be at least 32 characters"; exit 1; }

      - name: Resolve D1 id + public URL (creates the D1 database on first deploy)
        id: config
        env:
          CREATE_D1: "1"
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: node .github/scripts/prepare-wrangler-config.mjs wrangler.jsonc

      - name: Apply D1 migrations
        run: npx --yes "wrangler@${WRANGLER_VERSION}" d1 migrations apply flat-hunt --remote

      - name: Deploy Worker (with secrets)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          # Optional secrets: uploaded only when set (Google sign-in, Reddit source, Groq AI fallback).
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Optional plain config from repository Variables, passed as Worker vars only when set.
          VAR_ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          VAR_REDDIT_USERNAME: ${{ vars.REDDIT_USERNAME }}
          VAR_PUBLIC_RATE_LIMIT: ${{ vars.PUBLIC_RATE_LIMIT }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          node -e '
            const keys = ["APIFY_TOKEN","INGEST_SECRET","APP_PASSWORD","SESSION_SECRET","GOOGLE_CLIENT_ID","GOOGLE_CLIENT_SECRET","REDDIT_CLIENT_ID","REDDIT_CLIENT_SECRET","GROQ_API_KEY"];
            const out = {};
            for (const k of keys) if (process.env[k]) out[k] = process.env[k];
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out));
          ' "$secrets_file"
          var_args=()
          for v in ADMIN_EMAILS REDDIT_USERNAME PUBLIC_RATE_LIMIT; do
            val="VAR_$v"; val="${!val}"
            [ -z "$val" ] || var_args+=(--var "$v:${val// /}")
          done
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy \
            --secrets-file "$secrets_file" \
            "${var_args[@]}" \
            --message "${GITHUB_SHA::7} ${GITHUB_REF_NAME} run ${GITHUB_RUN_ID}"
          rm -f "$secrets_file"

      - name: Smoke test (health up, data locked, webhook rejects bad secret)
        id: smoke
        env:
          BASE: ${{ steps.config.outputs.base_url }}
        run: |
          ok=""
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$BASE/healthz" >/dev/null; then ok=1; break; fi
            echo "waiting for $BASE/healthz ($i)"; sleep 6
          done
          [ -n "$ok" ] || { echo "::error::$BASE/healthz did not return 200"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/api/listings")
          echo "unauthenticated GET /api/listings -> $code"
          [ "$code" = "401" ] || { echo "::error::Listings API is not behind login (got $code, want 401)"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
            -H 'Content-Type: application/json' -H 'X-Ingest-Secret: wrong' \
            --data '{"datasetId":"smoke-test"}' "$BASE/api/ingest/apify")
          echo "ingest with wrong secret -> $code"
          [ "$code" = "401" ] || [ "$code" = "403" ] || { echo "::error::Ingest endpoint accepted a wrong secret (got $code)"; exit 1; }

      - name: Roll back Worker if smoke test failed
        if: failure() && steps.smoke.conclusion == 'failure'
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" rollback \
            --message "auto-rollback: smoke test failed for ${GITHUB_SHA::7}" \
            || echo "::warning::Rollback failed (first deploy has no previous version?)"
