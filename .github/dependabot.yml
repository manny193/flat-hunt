version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "04:30"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "04:30"
      timezone: Asia/Kolkata
    ignore:
      # Stay on Node 22 LTS until the app is tested on a newer major.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "docker"
